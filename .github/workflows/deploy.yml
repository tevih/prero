name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Unit and build tests
        run: npx vitest run

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  bluehost:
    name: Deploy to Bluehost
    needs: test
    # Set the repository variable DEPLOY_BLUEHOST to "true" to switch this on.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_BLUEHOST == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Bluehost serves the site from the domain root, not a /<repo>/ subpath,
      # so this is a different build from the one Pages gets.
      - name: Build for the domain root
        env:
          SITE: ${{ vars.SITE_URL }}
          BASE_PATH: /
        run: npm run build

      - name: Verify the root-base build
        env:
          BASE_PATH: /
        run: npx vitest run tests/build

      - name: Upload to Bluehost over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_REMOTE_DIR }}
          # These filter what is uploaded from dist/, not what exists on the
          # server. The action tracks its own manifest and leaves files it did
          # not upload alone, so anything already in public_html survives.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
