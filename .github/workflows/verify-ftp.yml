name: Verify Bluehost connection

# Manual only. Connects, inspects the target directory and checks whether the
# site is reachable. Uploads nothing.
on:
  workflow_dispatch:
    inputs:
      write_test:
        description: 'Also upload and delete a scratch file to prove write access'
        type: boolean
        default: false
      full_list:
        description: 'Print every item in the target directory'
        type: boolean
        default: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check the FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          node scripts/check-ftp.mjs \
            ${{ inputs.write_test && '--write' || '' }} \
            ${{ inputs.full_list && '--list' || '' }}

      - name: Check whether the site is reachable
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ORIGIN_IP: ${{ vars.ORIGIN_IP }}
        run: |
          host=$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*##')

          echo "== What DNS says =="
          getent hosts "$host" || echo "  (does not resolve)"

          echo
          echo "== Over current DNS: ${SITE_URL} =="
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$SITE_URL" || echo "000")
          echo "  HTTP ${code}"
          if [ "$code" = "000" ]; then
            echo "  nothing answered on 80/443 at the address DNS points to"
          else
            grep -o '<title>[^<]*</title>' /tmp/body | head -1 | sed 's/^/  /'
          fi

          # Ask the server the files actually live on to serve the site,
          # bypassing DNS. This proves Apache is right before the domain moves.
          if [ -n "${ORIGIN_IP:-}" ]; then
            echo
            echo "== Direct to origin ${ORIGIN_IP} with Host: ${host} =="
            for scheme in http https; do
              extra=""
              [ "$scheme" = "https" ] && extra="-k --resolve ${host}:443:${ORIGIN_IP}"
              if [ "$scheme" = "https" ]; then
                c=$(curl -sS $extra -o /tmp/o -w '%{http_code}' --max-time 25 "https://${host}/" || echo "000")
              else
                c=$(curl -sS -H "Host: ${host}" -o /tmp/o -w '%{http_code}' --max-time 25 "http://${ORIGIN_IP}/" || echo "000")
              fi
              echo "  ${scheme} -> ${c}"
              [ "$c" = "200" ] && grep -o '<title>[^<]*</title>' /tmp/o | head -1 | sed 's/^/      /'
            done
          else
            echo
            echo "  (set the ORIGIN_IP variable to test the origin server directly)"
          fi
